packages:
  - apps/*
  - packages/*
  - packages/*-adapters/*
  - tooling/*
# mobile/ (Dart/Melos) and tools/ (standalone Stage M tool) are intentionally not members.

# Supply-chain hardening: dependency install scripts are blocked unless allow-listed here.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - argon2
  - prisma
  - '@prisma/engines'
  # Prisma 6 runs `prisma generate` from the client's own postinstall; v7 did not.
  - '@prisma/client'
  - esbuild
# Optional native builds pulled in by testcontainers (docker-modem/ssh2); not needed, explicitly denied.
ignoredBuiltDependencies:
  - cpu-features
  - ssh2
  - protobufjs

# Security overrides (OSV, Stage 5 CI-000). Each entry pins a patched release of a transitive dependency whose
# parent still declares the vulnerable version. Remove an override when the parent range moves past it.
overrides:
  '@grpc/grpc-js@1.14.4': 1.14.5
  '@vitest/mocker@5.0.1': 5.0.3
  deepmerge-ts@7.1.5: 8.0.2 # GHSA-ggr8-5vv4-36mx (@prisma/config 7.10.0, dev only)
  qs@6.16.0: 6.16.1 # GHSA-6pq8-jhm2-2vcw (superagent/supertest, dev only)
  fast-uri@3.1.8: 3.1.9
  fast-uri@4.1.5: 4.2.3
  fastify@5.11.3: 5.12.6 # NestJS 11 platform-fastify pins 5.11.3
  fastify@5.12.5: 5.12.6
  file-type@21.0.0: 21.3.4
  mariadb@3.4.5: 3.5.4 # @prisma/adapter-mariadb transitive version
  mysql2@3.15.3: 3.24.4 # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3 (prisma CLI 7.10.0, dev only)
  source-map-js@1.2.1: 1.2.2
  undici@8.10.2: 8.12.2

patchedDependencies:
  '@prisma/adapter-mariadb@6.19.3': patches/@prisma__adapter-mariadb@6.19.3.patch
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
