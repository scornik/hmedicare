packages:
  - apps/*
  - packages/*
  - packages/*-adapters/*
  - tooling/*
# mobile/ (Dart/Melos) and tools/ (standalone Stage M tool) are intentionally not members.

# Supply-chain hardening: dependency install scripts are blocked unless allow-listed here.
allowBuilds:
  argon2: true
  prisma: true
  '@prisma/engines': true
  esbuild: true
  # Optional native builds pulled in by testcontainers (docker-modem/ssh2); not needed, explicitly denied.
  cpu-features: false
  ssh2: false
  protobufjs: false
