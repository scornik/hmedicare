# Local development stack (LOCAL-DEVELOPMENT.md §2). No paid providers, no real credentials.
# `pnpm infra:up` starts mariadb + mock-providers. MinIO is only needed by the S3 storage adapter
# (DOC-002, later stage): `docker compose -f infrastructure/docker/compose.yaml --profile storage up -d`.
name: hmedic

services:
  mariadb:
    # Series moves with HOST-001 (HOSTING-VERIFICATION.md #2). Digest recorded 2026-09-18.
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    environment:
      MARIADB_ROOT_PASSWORD: local-only-root
      MARIADB_DATABASE: hmedic_dev
      MARIADB_USER: hmedic_app
      MARIADB_PASSWORD: local-only-password
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  mock-providers:
    # Provider-shaped HTTP mocks (Zaman IT SMS today; AI/payment/video mocks in later stages).
    # Zero-dependency Node server, mounted read-only; never makes outbound network calls.
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ['node', '/app/server.mjs']
    working_dir: /app
    environment:
      PORT: '4010'
    ports:
      - '127.0.0.1:4010:4010'
    volumes:
      - ./mock-providers:/app:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4010/health']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ['storage']
    # MinIO stopped publishing images to Docker Hub; quay.io mirror pinned by digest (2026-09-18).
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: local-only-minio
      MINIO_ROOT_PASSWORD: local-only-minio-password
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb-data:
  minio-data:
