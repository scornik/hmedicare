# HMedic mobile workspace (MOBILE-IMPLEMENTATION.md §1): Melos 8 on Dart pub workspaces.
# Flutter is pinned by FVM in .fvmrc (3.44.8, Dart 3.12.2). Run melos with `dart run melos <script>`.
name: hm_workspace
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - packages/hm_core
  - packages/hm_api
  - packages/hm_auth
  - packages/hm_localization
  - packages/hm_design
  - apps/doctor_app
  - apps/patient_app
dev_dependencies:
  melos: 8.7.0
melos:
  scripts:
    analyze:
      run: dart run melos exec -c 1 -- flutter analyze --fatal-infos
      description: flutter analyze in every package (infos are errors)
    test:
      run: dart run melos exec -c 1 --dir-exists=test -- flutter test
      description: unit and widget tests
    format:check:
      run: dart format --output=none --set-exit-if-changed apps/doctor_app/lib apps/doctor_app/test apps/patient_app/lib apps/patient_app/test packages/hm_core/lib packages/hm_core/test packages/hm_auth/lib packages/hm_auth/test packages/hm_localization/lib packages/hm_localization/test packages/hm_design/lib packages/hm_api/lib/hm_api.dart packages/hm_api/tool
    generate:api:
      run: dart run melos exec --scope=hm_api -- "dart run tool/clean_generated.dart && dart run swagger_parser && dart run build_runner build --delete-conflicting-outputs"
      description: regenerate the Dart API client from packages/contracts/generated/openapi.v1.oas30.json
    build:android:staging:
      run: dart run melos exec --scope=doctor_app --scope=patient_app -- flutter build apk --release --dart-define=APP_ENV=staging --dart-define-from-file=../../env/staging.json
