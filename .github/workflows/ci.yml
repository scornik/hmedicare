# CI (CI-CD.md §3). Every action is pinned by full commit SHA (tag in the comment). No deploy steps here:
# Hostinger builds from protected branches, and nothing in CI ever pushes to `production`.
# No provider credentials exist in GitHub secrets; SMS runs with the mock (the live smoke aborts on CI=true).
# Runner: repository variable CI_RUNS_ON (JSON), e.g. ["self-hosted","hmedic"] for the Windows self-hosted
# runner (Stage 5 task zero); it defaults to GitHub-hosted ubuntu-24.04. Every step is portable bash (Git Bash
# on Windows) and fails on the first error (`set -euo pipefail` where a step has several commands).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  SMS_PROVIDER: mock
  ZAMANIT_LIVE_SMOKE: 'false'
  TURBO_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  install:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install

  static:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: format
        run: pnpm format:check
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: dependency rules (depcruise)
        run: pnpm depcruise
      - name: architecture rule fixtures
        run: pnpm test:architecture
      - name: migration lint + applied-migration immutability
        run: |
          set -euo pipefail
          pnpm --filter @hmedic/database run db:migration:lint
          BASE_REF=origin/main node scripts/ci/check-applied-migrations.mjs

  unit:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install
      - name: unit (incl. authorization-matrix doc parity, SMS adapter contract vs mock-providers)
        run: pnpm test:unit

  integration:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    strategy:
      fail-fast: false
      matrix:
        # Supported MariaDB series (ADR-014: 10.6 floor; 11.8 is the deployed series). Digests pinned.
        image:
          - mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
          # The deployed plan runs this series (HOST-001, 2026-09-20).
          - mariadb:11.8@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install
      # The CLI tests spawn built entry points (dist/cli/*.js); building first keeps their in-test `tsc -b`
      # a no-op instead of a cold multi-package build inside a test timeout.
      - name: build packages used by CLI tests
        run: pnpm exec turbo run build --filter=@hmedic/identity-access... --filter=@hmedic/secrets...
      - name: integration + security (migrations from clean, engine contract, jobs, auth, tenant isolation, secrets)
        env:
          MARIADB_IMAGES: ${{ matrix.image }}
        run: pnpm test:integration

  contracts:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install
      - name: OpenAPI 3.1 + 3.0 up to date, operationIds, money lint, TS client types
        run: pnpm openapi:check
      - name: TS client compiles
        run: pnpm --filter @hmedic/contracts run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi
          path: packages/contracts/generated/
          retention-days: 30

  security-static:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: repository secrets scan (provider keys, sandbox values, real BD phones)
        run: pnpm secrets:scan
      - name: gitleaks (pinned version; checksum verified against the release manifest)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tmp"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          else
            asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          curl -fsSL -o "$tmp/$asset" "${base}/${asset}"
          curl -fsSL -o "$tmp/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$tmp" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -o -q "$tmp/$asset" gitleaks.exe -d "$tmp"
            bin="$tmp/gitleaks.exe"
          else
            tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
            bin="$tmp/gitleaks"
          fi
          "$bin" git --redact --no-banner --exit-code 1 .
      - name: license allow-list
        run: pnpm license:scan
      - name: dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high
      - name: SBOM (CycloneDX, workspace)
        run: pnpm dlx @cyclonedx/cdxgen@12.8.4 -t js --required-only -o sbom.cdx.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  osv:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same scanner as google/osv-scanner-action v2.6.0, as the pinned release binary (checksum verified):
      # container actions cannot run on the Windows self-hosted runner.
      - name: osv-scanner (pinned release, checksum verified)
        env:
          OSV_VERSION: 2.6.0
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/osv"
          mkdir -p "$tmp"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then asset="osv-scanner_windows_amd64.exe"; else asset="osv-scanner_linux_amd64"; fi
          curl -fsSL -o "$tmp/$asset" "${base}/${asset}"
          curl -fsSL -o "$tmp/SHA256SUMS" "${base}/osv-scanner_SHA256SUMS"
          (cd "$tmp" && grep " ${asset}\$" SHA256SUMS | sha256sum -c -)
          chmod +x "$tmp/$asset"
          "$tmp/$asset" scan source --lockfile=pnpm-lock.yaml

  web:
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install
      - name: web build (VITE_* secret-name check) + component tests
        run: |
          set -euo pipefail
          pnpm --filter @hmedic/web build
          pnpm --filter @hmedic/web test
      - name: Playwright smoke (built app against a mocked API)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then deps="--with-deps"; else deps=""; fi
          pnpm --filter @hmedic/web exec playwright install $deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 14

  mobile:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: runner.environment == 'github-hosted'
        with:
          flutter-version-file: mobile/.fvmrc
          channel: stable
      # Self-hosted runners use the machine's Flutter; it must be exactly the version pinned in .fvmrc.
      - name: Flutter version matches mobile/.fvmrc (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          want="$(node -p "JSON.parse(require('fs').readFileSync('.fvmrc','utf8')).flutter")"
          have="$(flutter --version --machine | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).frameworkVersion))")"
          echo "Flutter pinned ${want}, installed ${have}"
          test "$want" = "$have"
      # Melos 8.7.0 is a pinned dev dependency of the workspace root (pubspec.lock), run via `dart run melos`.
      - run: flutter pub get --enforce-lockfile
      - name: generated Dart API client is up to date (incl. deleted/added files)
        run: |
          set -euo pipefail
          dart run melos run generate:api
          test -z "$(git status --porcelain -- packages/hm_api/lib/generated)"
      - run: dart run melos run format:check
      - run: dart run melos run analyze
      - run: dart run melos run test
      - name: mobile dependency licenses
        working-directory: .
        run: node scripts/mobile-license-scan.mjs

  build:
    needs: [static, unit, integration, contracts]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-install
      - name: build api, worker, host-probe
        run: pnpm exec turbo run build --filter=@hmedic/api... --filter=@hmedic/worker... --filter=@hmedic/host-probe...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-dist
          path: |
            apps/api/dist/
            apps/worker/dist/
            apps/host-probe/dist/
          retention-days: 14
